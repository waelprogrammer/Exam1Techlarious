<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact admin | HelpLink</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
        <a class="logo" href="index.html">HelpLink</a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="requests.html">My requests</a>
            <a href="offer.html">Offer help</a>
        </nav>
        <div class="account-links">
            <a class="button" href="cart.html">List / Cart (2)</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign up</a>
        </div>
    </header>

    <div class="content">
        <h1>Contact admin</h1>
        <p>Ask a question or report a problem.</p>
        <form class="card simple-form" id="report">
            <label for="email">Your email</label>
            <input id="email" type="email" required>
            <label for="subject">Subject</label>
            <input id="subject" type="text" required>
            <label for="message">Message</label>
            <textarea id="message" rows="5" required></textarea>
            <button type="button">Send message</button>
        </form>
    </div>

    <footer>
        <p>HelpLink | Community help</p>
        <div>
            <a href="contact.html">Contact admin</a>
            <a href="contact.html#report">Report a problem</a>
        </div>
    </footer>
</body>
</html>
