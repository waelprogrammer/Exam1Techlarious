<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HelpLink</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <a class="logo" href="index.html">HelpLink</a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
        </nav>
        <div class="account-links">
            <a href="login.html">Login</a>
            <a href="signup.html">Sign up</a>
        </div>
    </header>

    <div class="content">
        <div class="account-form">
            <h1>Welcome back</h1>
            <p>Log in to your HelpLink account</p>
            <form>
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="Enter your email" autocomplete="email" required>
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                <p class="forgot"><a href="contact.html">Forgot password?</a></p>
                <button type="button">Login</button>
            </form>
            <p class="account-note">New to HelpLink? <a href="signup.html">Sign up</a></p>
        </div>
        <p class="account-note"><a href="admin.html">Admin dashboard</a></p>
    </div>

    <footer>
        <p>HelpLink | Community help</p>
        <div>
            <a href="contact.html">Contact admin</a>
            <a href="contact.html#report">Report a problem</a>
        </div>
    </footer>
</body>
</html>
