<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer help | HelpLink</title>
    <link rel="stylesheet" href="offer.css">
</head>
<body>
    <header>
        <a class="logo" href="index.html">HelpLink</a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="requests.html">My requests</a>
            <a href="offer.html">Offer help</a>
        </nav>
        <div class="account-links">
            <a class="button" href="cart.html">List / Cart (2)</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign up</a>
        </div>
    </header>

    <div class="content">
        <h1>Offer help</h1>
        <p>Share your skills with the community.</p>
        <form class="card simple-form">
            <label for="title">Service title</label>
            <input id="title" type="text" placeholder="For example, programming help" required>
            <label for="category">Category</label>
            <select id="category">
                <option>Technology</option>
                <option>Home repairs</option>
                <option>Career / CV</option>
                <option>Design</option>
            </select>
            <label for="description">Description</label>
            <textarea id="description" rows="3" required></textarea>
            <label for="available">Availability</label>
            <input id="available" type="text" placeholder="For example, Friday afternoon">
            <button type="button">Publish service</button>
        </form>
    </div>

    <footer>
        <p>HelpLink | Community help</p>
        <div>
            <a href="contact.html">Contact admin</a>
            <a href="contact.html#report">Report a problem</a>
        </div>
    </footer>
</body>
</html>
