<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | HelpLink</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <header>
        <a class="logo" href="index.html">HelpLink</a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
        </nav>
        <div class="account-links">
            <a href="login.html">Login</a>
            <a href="signup.html">Sign up</a>
        </div>
    </header>

    <div class="content">
        <div class="account-form">
            <h1>Create an account</h1>
            <p>Join your community on HelpLink</p>
            <form>
                <label for="name">Full name</label>
                <input id="name" type="text" placeholder="Enter your full name" autocomplete="name" required>
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="Enter your email" autocomplete="email" required>
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Choose a password" autocomplete="new-password" required>
                <label for="confirm">Confirm password</label>
                <input id="confirm" type="password" placeholder="Enter your password again" autocomplete="new-password" required>
                <button type="button">Sign up</button>
            </form>
            <p class="account-note">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>

    <footer>
        <p>HelpLink | Community help</p>
        <div>
            <a href="contact.html">Contact admin</a>
            <a href="contact.html#report">Report a problem</a>
        </div>
    </footer>
</body>
</html>
